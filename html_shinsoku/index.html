<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>sample</title>
  <link rel="stylesheet" href="asset/katex/katex.min.css">
  <link rel="stylesheet" href="asset/index.css">
</head>
<body>
  <div id="main_container">
    <h1>実測図</h1>
    <div id="zumen_select" class="print_hide">
      <button type="button" id="drawing_previous">前の図面</button>
      <select id="zumen_type">
        <option value="">図面を選択</option>
      </select>
      <button type="button" id="drawing_next">次の図面</button>
      <label><input type="checkbox" id="print_all"> 全図面を印刷（座標表の続きも含む）</label>
    </div>
    <div id="info_container">
      <div id="jissokudate">
        <div class="description">実測年月日</div>
        <div class="value" id="sokuryobi"></div>
      </div>
      <div id="jissokusya">
        <div class="description">実測者氏名</div>
        <div class="value">
          <div class="value1" id="sokuryojigyosha">
          </div>
          <div class="value2" id="sokuryosha">
          </div>
        </div>
      </div>
      <div id="seizudate">
        <div class="description">製図年月日</div>
        <div class="value" id="seizubi"></div>
      </div>
      <div id="seizusya">
        <div class="description">製図者氏名</div>
        <div class="value">
          <div class="value1" id="seizujigyosha">
          </div>
          <div class="value2" id="seizusha">
          </div>
        </div>
      </div>
      <div id="location">
        <div class="value">
          <div class="value1" id="sanrinshoyusha">
          </div>
          <div class="value2" id="rinshohan">
          </div>
          <!-- <div class="value3" id="haisui_name">
          </div> -->
        </div>
      </div>
    </div>
    <div id="sub_container">
      <div id="xy_container">
        <dl id="detail">
          <div data-option-panel="mix">
            <dt class="description">外周全長</dt>
            <dd class="value"><span id="shui_length"></span>m</dd>
          </div>
          <!-- <div>
            <dt class="description">延長</dt>
            <dd class="value"><span></span>m</dd>
          </div> -->
          <div data-option-panel="mix">
            <dt class="description">面積</dt>
            <dd class="value"><span id="area"></span>m<sup>2</sup></dd>
          </div>
          <!-- <div>
            <dt class="description">幅</dt>
            <dd class="value"><span></span>m</dd>
          </div> -->
          <div id="crs_detail">
            <dt class="description">測地系&nbsp;</dt>
            <dd class="value" id="crs"></dd>
          </div>
        </dl>
        <div id="xy_updown" class="print_hide" hidden>
          <button type="button" id="xy_prev">▲</button>
          <button type="button" id="xy_next">▼</button>
        </div>
      </div>
      <div id="map_container" data-map-visible="1">
        <label id="map_visibility_control" class="print_hide" title="地図欄の表示を切り替える">
          <input type="checkbox" id="map_visibility_toggle" checked>
          <span>地図を表示</span>
        </label>
        <div id="map_detail">
          <dl>
            <div id="area2_" data-option-panel="mix">
              <dt class="description">面積&nbsp;</dt>
              <dd class="value"><span id="area2"></span>m<sup>2</sup></dd>
            </div>
            <!-- <div>
              <dt class="description">延長&nbsp;</dt>
              <dd class="value">
                m</dd>
            </div> -->
            <div id="scale_">
                <dt class="description">縮尺&nbsp;</dt>
              <dd class="value" id="scale"></dd>
            </div>
          </dl>
        </div>
        <div id="map">
          <img src="asset/houi.svg" alt="" id="houi">
          <!-- <img src="asset/shui_map.png" alt="" class="main_map" data-option-panel="shui"> -->
          <!-- <img src="asset/haisui_map.png" alt="" class="main_map" data-option-panel="haisui"> -->
          <!-- <img src="asset/mix_map.png" alt="" class="main_map" data-option-panel="mix"> -->
        </div>
        <div id="calc" data-option-panel="mix">
          <div id="calc_distance"></div>
          <div id="calc_area"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="asset/katex/katex.min.js"></script>
  <script>
    (() => {
      document.querySelectorAll("[data-latex]").forEach((element) => {
        if (!window.katex) {
          return;
        }
        window.katex.render(element.dataset.latex, element, {
          throwOnError: false,
          strict: "ignore",
          output: "htmlAndMathml",
        });
      });

      const select = document.getElementById("zumen_type");
      const panels = document.querySelectorAll("[data-option-panel]");
      const xyUpdown = document.getElementById("xy_updown");
      const xyPrev = document.getElementById("xy_prev");
      const xyNext = document.getElementById("xy_next");
      const xyTables = Array.from(document.querySelectorAll("[data-xy-table]"));
      const mapContainer = document.getElementById("map_container");
      const mapVisibilityToggle = document.getElementById("map_visibility_toggle");
      const calc = document.getElementById("calc");
      const baseTitle = document.title;
      let currentXyIndex = 0;

      if (!select) {
        return;
      }

      const panelValues = (panel) => (
        panel.dataset.optionPanel || ""
      ).split(/\s+/).filter(Boolean);

      const updateMapVisibility = () => {
        if (!mapContainer || !mapVisibilityToggle) {
          return;
        }
        mapContainer.dataset.mapVisible = mapVisibilityToggle.checked ? "1" : "0";
      };

      const syncMapVisibilityWithXyTable = (hasActiveXyTable) => {
        if (!mapVisibilityToggle) {
          return;
        }
        mapVisibilityToggle.checked = hasActiveXyTable && currentXyIndex === 0;
        updateMapVisibility();
      };

      const updatePanels = () => {
        const selectedValue = select.value;
        const optionValues = new Set(
          Array.from(select.options).map((option) => option.value)
        );

        panels.forEach((panel) => {
          if (panel.id === "calc" && panel.dataset.isJochiKeisan !== "1") {
            panel.hidden = true;
            return;
          }
          const values = panelValues(panel);
          const hasOption = values.some((value) => optionValues.has(value));
          panel.hidden = !hasOption || !values.includes(selectedValue);
        });
      };

      const updateXyTables = () => {
        const selectedValue = select.value;
        const activeXyTables = xyTables.filter((table) => (
          panelValues(table).includes(selectedValue)
        ));

        if (activeXyTables.length === 0) {
          if (xyUpdown) {
            xyUpdown.hidden = true;
          }
          xyTables.forEach((table) => {
            table.hidden = true;
          });
          syncMapVisibilityWithXyTable(false);
          return;
        }

        if (currentXyIndex >= activeXyTables.length) {
          currentXyIndex = 0;
        }

        xyTables.forEach((table, index) => {
          table.hidden = true;
        });

        activeXyTables.forEach((table, index) => {
          table.hidden = index !== currentXyIndex;
        });

        if (xyUpdown) {
          xyUpdown.hidden = activeXyTables.length <= 1;
        }
        syncMapVisibilityWithXyTable(true);
      };

      const updateTitle = () => {
        const selectedOption = select.options[select.selectedIndex];
        if (!selectedOption || !select.value) {
          document.title = baseTitle;
          return;
        }

        document.title = `${baseTitle.replace(/\s*-\s*実測図\s*$/, "")} - ${selectedOption.textContent.trim()} - 実測図`;
      };

      if (xyPrev) {
        xyPrev.addEventListener("click", () => {
          const activeXyTables = xyTables.filter((table) => (
            panelValues(table).includes(select.value)
          ));

          if (activeXyTables.length === 0) {
            return;
          }

          currentXyIndex = (currentXyIndex - 1 + activeXyTables.length) % activeXyTables.length;
          updateXyTables();
        });
      }

      if (xyNext) {
        xyNext.addEventListener("click", () => {
          const activeXyTables = xyTables.filter((table) => (
            panelValues(table).includes(select.value)
          ));

          if (activeXyTables.length === 0) {
            return;
          }

          currentXyIndex = (currentXyIndex + 1) % activeXyTables.length;
          updateXyTables();
        });
      }

      if (mapVisibilityToggle) {
        mapVisibilityToggle.addEventListener("change", updateMapVisibility);
      }

      select.addEventListener("change", () => {
        currentXyIndex = 0;
        updatePanels();
        updateXyTables();
        updateTitle();
      });

      const previous = document.getElementById("drawing_previous");
      const next = document.getElementById("drawing_next");
      const drawingIndices = Array.from(select.options).map((option, i) => option.value ? i : -1).filter(i => i >= 0);
      const updateNavigation = () => {
        previous.disabled = select.selectedIndex === drawingIndices[0];
        next.disabled = select.selectedIndex === drawingIndices[drawingIndices.length - 1];
      };
      for (const [button, step] of [[previous, -1], [next, 1]]) {
        button.addEventListener("click", () => {
          const index = drawingIndices.indexOf(select.selectedIndex) + step;
          if (index >= 0 && index < drawingIndices.length) {
            select.selectedIndex = drawingIndices[index];
            select.dispatchEvent(new Event("change"));
          }
        });
      }
      select.addEventListener("change", updateNavigation);
      if (!select.value && drawingIndices.length) select.selectedIndex = drawingIndices[0];
      updateNavigation();

      const printSettings = document.createElement("span");
      printSettings.textContent = "印刷：指定用紙・横向き／倍率100%／余白なし／ヘッダー・フッターなし";
      document.getElementById("zumen_select").append(printSettings);
      const fitHeaders = () => {
        document.querySelectorAll("#info_container .value, #info_container .value1, #info_container .value2").forEach(element => {
          element.style.fontSize = "";
          for (let size = 3; size > 1.5 && (element.scrollHeight > element.clientHeight + 1 || element.scrollWidth > element.clientWidth + 1); size -= 0.1) {
            element.style.fontSize = size + "mm";
          }
        });
      };
      document.fonts.ready.then(fitHeaders);
      window.addEventListener("resize", fitHeaders);
      window.addEventListener("beforeprint", () => {
        document.getElementById("print_pages")?.remove();
        const all = document.getElementById("print_all").checked;
        document.body.dataset.printAll = all ? "1" : "0";
        if (!all) return;
        const saved = [select.selectedIndex, currentXyIndex, mapVisibilityToggle.checked, document.title];
        const pages = document.createElement("div");
        pages.id = "print_pages";
        for (const index of drawingIndices) {
          select.selectedIndex = index;
          updatePanels();
          const count = Math.max(1, xyTables.filter(table => panelValues(table).includes(select.value)).length);
          for (let pageIndex = 0; pageIndex < count; pageIndex++) {
            currentXyIndex = pageIndex;
            updateXyTables();
            const wrapper = document.createElement("div");
            wrapper.className = "print-page";
            const sheet = document.getElementById("main_container").cloneNode(true);
            sheet.querySelector("#zumen_select")?.remove();
            wrapper.append(sheet);
            pages.append(wrapper);
          }
        }
        document.body.append(pages);
        [select.selectedIndex, currentXyIndex] = saved;
        updatePanels();
        updateXyTables();
        mapVisibilityToggle.checked = saved[2];
        updateMapVisibility();
        document.title = saved[3];
      });
      window.addEventListener("afterprint", () => {
        document.getElementById("print_pages")?.remove();
        delete document.body.dataset.printAll;
      });

      const renderCalc = () => {
        if (!calc) {
          return;
        }

        if (calc.dataset.isJochiKeisan !== "1") {
          calc.hidden = true;
        }
      };

      updatePanels();
      renderCalc();
      updateXyTables();
      updateTitle();
    })();
  </script>
</body>
</html>
