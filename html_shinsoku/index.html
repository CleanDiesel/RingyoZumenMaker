<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>sample</title>
  <link rel="stylesheet" href="asset/katex/katex.min.css">
  <link rel="stylesheet" href="asset/index.css">
</head>
<body>
  <div id="main_container">
    <h1>申請区域図</h1>
    <div id="info_container">
      <div id="seizudate">
        <div class="description">製図年月日</div>
        <div class="value" id="seizubi"></div>
      </div>
      <div id="seizusya">
        <div class="description">製図者氏名</div>
        <div class="value">
          <div class="value1" id="seizujigyosha">
          </div>
          <div class="value2" id="seizusha">
          </div>
        </div>
      </div>
      <div id="location">
        <div class="value">
          <div class="value1" id="sanrinshoyusha">
          </div>
          <div class="value2" id="rinshohan">
          </div>
        </div>
      </div>
      <div id="shinseibango">
        <div class="description">申請番号</div>
        <div class="value" id="shinseino"></div>
      </div>
    </div>
    <div id="sub_container">
      <div id="xy_container">
        <dl id="detail">
          <div id="crs_detail">
            <dt class="description">測地系&nbsp;</dt>
            <dd class="value" id="crs"></dd>
          </div>
          <div id="scale_">
              <dt class="description">縮尺&nbsp;</dt>
            <dd class="value" id="scale"></dd>
          </div>
        </dl>
        <div id="calc"><div class="calc-heading">面積計算</div><div id="calc_area"></div></div>
      </div>
      <div id="map_container" data-map-visible="1">
        <label id="map_visibility_control" class="print_hide" title="地図欄の表示を切り替える">
          <input type="checkbox" id="map_visibility_toggle" checked>
          <span>地図を表示</span>
        </label>
        <div id="map_legend">
          <span class="red-circle"></span>
          <span class="red-circle-description">&nbsp;基準点</span>
        </div>
        <div id="map">
          <img src="asset/houi.svg" alt="" id="houi">
          <img src="asset/map.png" alt="" class="main_map">
        </div>
      </div>
    </div>
  </div>
  <script src="asset/katex/katex.min.js"></script>
  <script>
    (() => {
      document.querySelectorAll("[data-latex]").forEach((element) => {
        if (!window.katex) {
          return;
        }
        window.katex.render(element.dataset.latex, element, {
          throwOnError: false,
          strict: "ignore",
          output: "htmlAndMathml",
        });
      });

      const mapContainer = document.getElementById("map_container");
      const toggle = document.getElementById("map_visibility_toggle");
      if (mapContainer && toggle) {
        const update = () => { mapContainer.dataset.mapVisible = toggle.checked ? "1" : "0"; };
        toggle.addEventListener("change", update);
        update();
      }
    })();
  </script>
</body>
</html>
